name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      # Ubuntu's PHP reads the system zoneinfo; since 24.04 the backward-compatible
      # names (Europe/Kiev, US/Eastern) live in tzdata-legacy. Hosters keep them.
      - name: Legacy time zone names
        run: sudo apt-get install -y --no-install-recommends tzdata-legacy

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none

      - name: Install dev dependencies (Kirby as fixture)
        run: composer install --no-interaction --no-progress --prefer-dist --ignore-platform-req=ext-gd

      - name: Tests
        run: sh tests/run.sh
